<div class="app">
  <header class="header">
    <h1>JSON Formatter</h1>
    <p class="muted">Validate, pretty-print or minify JSON.</p>
  </header>
  <div class="row">
    <div class="segmented" id="indent">
      <button data-n="2" class="is-active">2 spaces</button>
      <button data-n="4">4 spaces</button>
      <button data-n="0">Minify</button>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="status">Empty</span>
  </div>
  <div class="grid-2">
    <label class="field">
      <span class="label">Input</span>
      <textarea class="textarea mono" id="in" spellcheck="false" placeholder='{"hello": "world"}'></textarea>
    </label>
    <div class="field">
      <span class="label">Output</span>
      <pre class="output" id="out" data-placeholder="Formatted JSON appears here"></pre>
    </div>
  </div>
</div>
<script>
  var n = 2, inp = document.getElementById('in'), out = document.getElementById('out'), st = document.getElementById('status')
  function run() {
    if (!inp.value.trim()) { out.textContent = ''; st.className = 'badge'; st.textContent = 'Empty'; inp.classList.remove('is-invalid'); return }
    try {
      out.textContent = JSON.stringify(JSON.parse(inp.value), null, n || undefined)
      st.className = 'badge badge-success'; st.textContent = 'Valid'; inp.classList.remove('is-invalid')
    } catch (e) {
      out.textContent = String(e.message); st.className = 'badge badge-danger'; st.textContent = 'Invalid'; inp.classList.add('is-invalid')
    }
  }
  inp.addEventListener('input', run)
  document.getElementById('indent').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return
    n = +b.dataset.n
    document.querySelectorAll('#indent button').forEach(function (x) { x.classList.toggle('is-active', x === b) })
    run()
  })
</script>
