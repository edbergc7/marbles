<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<div class="app">
  <header class="header">
    <h1>Cropper</h1>
    <p class="muted">Crop an image with Cropper.js loaded from cdnjs.</p>
  </header>
  <label class="dropzone" id="drop">
    <input type="file" id="file" accept="image/*" hidden>
    <div class="medium">Drop an image</div>
    <div class="hint">or click to browse</div>
  </label>
  <div class="stage" id="stage" hidden style="min-height:320px"><img id="img" alt=""></div>
  <div class="row row-between">
    <div class="segmented" id="aspect">
      <button data-r="NaN" class="is-active">Free</button>
      <button data-r="1">1:1</button>
      <button data-r="1.7778">16:9</button>
      <button data-r="1.3333">4:3</button>
    </div>
    <button class="btn btn-primary" id="export" disabled>Export PNG</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id) }
  var cropper = null
  function load(file) {
    if (!file || !/^image\//.test(file.type)) return
    var img = $('img')
    img.src = URL.createObjectURL(file)
    $('stage').hidden = false
    $('drop').classList.add('dropzone-compact')
    if (cropper) cropper.destroy()
    img.onload = function () { cropper = new Cropper(img, { viewMode: 1, autoCropArea: 0.8 }); $('export').disabled = false }
  }
  $('file').addEventListener('change', function () { load(this.files[0]) })
  var drop = $('drop')
  ;['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('is-over') }) })
  ;['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('is-over') }) })
  drop.addEventListener('drop', function (e) { load(e.dataTransfer.files[0]) })
  $('aspect').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('is-active', c === b) })
    if (cropper) cropper.setAspectRatio(parseFloat(b.dataset.r))
  })
  $('export').addEventListener('click', function () {
    if (!cropper) return
    cropper.getCroppedCanvas().toBlob(function (blob) {
      var a = document.createElement('a')
      a.href = URL.createObjectURL(blob); a.download = 'cropped.png'; a.click()
    })
  })
</script>
