# Builds Marbles for Windows, macOS and Linux.
#
# - Push a tag like v1.2.0: builds all three and attaches them to a DRAFT release.
#   Nothing is public until you check the draft and press Publish.
# - Run it by hand (Actions → Release → Run workflow): builds only, and the files
#   are kept as workflow artifacts for a few days. No release is made.
#
# Actions are pinned to commit SHAs so a moved tag can't change what runs here.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and test
        if: runner.os == 'Linux'
        run: |
          pnpm lint
          pnpm test

      - name: Build
        run: pnpm run ${{ matrix.script }}
        env:
          # Builds are unsigned on purpose: don't look for a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marbles-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*/marbles-*.exe
            dist/*/marbles-*.zip
            dist/*/marbles-*.dmg
            dist/*/marbles-*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lR files
          gh release create "$GITHUB_REF_NAME" files/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "Marbles ${GITHUB_REF_NAME#v}" \
            --generate-notes
